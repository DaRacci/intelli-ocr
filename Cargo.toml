[package]
name = "intelli-ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "fs",
  "net",
  "io-std",
  "io-util",
  "sync",
  "macros",
  "signal",
] }
clap = { version = "4.6.1", features = ["derive"] }
lamco-portal = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
xdg = "3.0.0"
