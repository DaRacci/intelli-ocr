[package]
name = "intelli-ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "fs",
  "net",
  "io-std",
  "io-util",
  "sync",
  "macros",
  "signal",
] }
clap = { version = "4.6.1", features = ["derive"] }
lamco-portal = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
xdg = "3.0.0"
grim-rs = { version = "0.1.9", default-features = false, features = ["png"] }
smithay-client-toolkit = { version = "0.20.0" }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12" }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
